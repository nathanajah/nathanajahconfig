- name: "install ripgrep - mac"
  homebrew:
    name: ripgrep
    state: latest
  when: ansible_distribution == 'MacOSX'

- name: "install curl - mac"
  homebrew:
    name: curl
    state: latest
  when: ansible_distribution == 'MacOSX'

- name: "install rsync - mac"
  homebrew:
    name: rsync
    state: latest
  when: ansible_distribution == 'MacOSX'
