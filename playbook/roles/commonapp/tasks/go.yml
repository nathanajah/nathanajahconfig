- name: "install go - mac"
  homebrew:
    name: go
    state: latest
  when: ansible_distribution == 'MacOSX'

- name: "install gopls - mac"
  homebrew:
    name: gopls
    state: latest
  when: ansible_distribution == 'MacOSX'

- name: "add golang backports ppa - ubuntu"
  apt_repository:
    repo: "ppa:longsleep/golang-backports"
    state: "present"
  become: true
  when: ansible_distribution == 'Ubuntu'
